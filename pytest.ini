[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    live: calls real external APIs (ElevenLabs, Google); run with `pytest -m live`
addopts = -m "not live"
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
