<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartAlarmPi</title>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; margin: 0; padding: 0; background: #0f172a; color: #e2e8f0; }
    .page { max-width: 860px; margin: 0 auto; padding: 2rem; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 1rem; padding: 1.5rem; margin-bottom: 1rem; }
    button { border: none; border-radius: 0.75rem; padding: 0.85rem 1.1rem; cursor: pointer; background: #2563eb; color: #fff; }
    button.secondary { background: #475569; }
    input, select { width: 100%; border-radius: 0.75rem; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; padding: 0.85rem; margin-top: 0.5rem; }
    input[type=range] { padding: 0.4rem 0; border: none; background: transparent; cursor: pointer; accent-color: #2563eb; }
    .row { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); }
    .hint { color: #94a3b8; font-size: 0.9rem; margin-top: 0; }
    .day { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 1rem; padding: 0.6rem 0; border-bottom: 1px solid #1f2937; }
    .day:last-of-type { border-bottom: none; }
    .day-name { font-weight: 600; }
    .day.off .day-name, .day.off .day-time { opacity: 0.45; }
    input.day-time { width: auto; margin-top: 0; padding: 0.5rem 0.75rem; color-scheme: dark; }
    .switch { position: relative; display: inline-block; width: 3rem; height: 1.7rem; }
    .switch input { opacity: 0; width: 0; height: 0; margin: 0; padding: 0; }
    .slider { position: absolute; inset: 0; background: #475569; border-radius: 999px; cursor: pointer; transition: background 0.2s; }
    .slider::before { content: ""; position: absolute; width: 1.3rem; height: 1.3rem; left: 0.2rem; top: 0.2rem; background: #fff; border-radius: 50%; transition: transform 0.2s; }
    .switch input:checked + .slider { background: #2563eb; }
    .switch input:checked + .slider::before { transform: translateX(1.3rem); }
    .switch input:focus-visible + .slider { outline: 2px solid #93c5fd; outline-offset: 2px; }
    .alarm-item { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.6rem 0; border-bottom: 1px solid #1f2937; }
    .alarm-item:last-of-type { border-bottom: none; }
  </style>
</head>
<body x-data="alarmApp()">
  <div class="page">
    <h1>SmartAlarmPi</h1>
    <section class="card">
      <h2>Weekly Alarms</h2>
      <p class="hint">Days that are on ring every week at their time.</p>
      <template x-for="day in week" :key="day.weekday">
        <div class="day" :class="{ off: !day.enabled }">
          <span class="day-name" x-text="day.day"></span>
          <input type="time" class="day-time" x-model="day.time" @change="saveDay(day, { time: day.time })" :aria-label="day.day + ' alarm time'" />
          <label class="switch">
            <input type="checkbox" x-model="day.enabled" @change="saveDay(day, { enabled: day.enabled })" :aria-label="day.day + ' alarm on'" />
            <span class="slider"></span>
          </label>
        </div>
      </template>
      <p x-text="weekMessage"></p>
    </section>

    <section class="card">
      <h2>One-off Alarms</h2>
      <div class="row">
        <label>
          Label
          <input type="text" x-model="oneOff.label" />
        </label>
        <label>
          Date & time
          <input type="datetime-local" x-model="oneOff.scheduled_at" />
        </label>
      </div>
      <button @click="createOneOff()" style="margin-top: 1rem;">Add Alarm</button>
      <p x-text="message"></p>
      <template x-for="alarm in alarms.filter(a => a.enabled)" :key="alarm.id">
        <div class="alarm-item">
          <div>
            <strong x-text="alarm.label"></strong>
            <div class="hint" x-text="formatAlarm(alarm)"></div>
          </div>
          <button @click="deleteAlarm(alarm.id)" class="secondary">Delete</button>
        </div>
      </template>
    </section>

    <section class="card">
      <h2>Alarm Controls</h2>
      <div class="row">
        <button @click="stopAlarm()">Stop Alarm</button>
        <button @click="playSummary()">Play Schedule Summary</button>
        <button @click="testSpeakers()">Test Speakers</button>
        <button @click="testVoice()">Test Voice</button>
        <button @click="stopTest()" class="secondary">Stop Test</button>
      </div>
      <div style="margin-top: 1rem;">
        <label>
          Volume: <strong x-text="levels.volume + '%'"></strong>
          <input type="range" min="0" max="100" step="1" x-model.number="levels.volume" @change="setLevel('volume')" />
        </label>
        <label>
          Music: <strong x-text="levels.music + '%'"></strong>
          <input type="range" min="0" max="100" step="1" x-model.number="levels.music" @change="setLevel('music')" />
        </label>
        <label>
          Voice: <strong x-text="levels.voice + '%'"></strong>
          <input type="range" min="0" max="100" step="1" x-model.number="levels.voice" @change="setLevel('voice')" />
        </label>
        <p style="color:#94a3b8; font-size:0.9rem;">Music and Voice balance the radio against speech; Volume sets the overall loudness. Start the speaker test, then use Test Voice to compare.</p>
      </div>
      <p x-text="controlMessage"></p>
    </section>

    <section class="card">
      <h2>Calendar</h2>
      <div class="row">
        <button @click="fetchCalendarSummary()">Refresh Summary</button>
      </div>
      <p x-text="calendarSummary"></p>
    </section>
  </div>

  <script>
    // Local "YYYY-MM-DDTHH:MM" for tomorrow 07:00, the format datetime-local inputs use.
    function tomorrowAt7() {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T07:00`;
    }

    function alarmApp() {
      return {
        alarms: [],
        week: [],
        message: '',
        weekMessage: '',
        controlMessage: '',
        levels: { volume: 70, music: 100, voice: 100 },
        oneOff: { label: 'Alarm', scheduled_at: tomorrowAt7() },
        async fetchWeek() {
          const res = await fetch('/schedule');
          if (res.ok) {
            this.week = await res.json();
          }
        },
        async saveDay(day, change) {
          const res = await fetch(`/schedule/${day.weekday}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(change),
          });
          if (res.ok) {
            const saved = await res.json();
            Object.assign(day, saved);
            this.weekMessage = saved.enabled ? `${saved.day} alarm on at ${saved.time}.` : `${saved.day} alarm off.`;
          } else {
            this.weekMessage = `Couldn't save ${day.day}.`;
            this.fetchWeek();
          }
        },
        async fetchAlarms() {
          const res = await fetch('/alarms');
          this.alarms = await res.json();
        },
        formatAlarm(alarm) {
          const when = new Date(alarm.scheduled_at).toLocaleString([], {
            weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
          });
          return alarm.repeat_weekly ? `${when} (repeats weekly)` : when;
        },
        async createOneOff() {
          if (!this.oneOff.scheduled_at || new Date(this.oneOff.scheduled_at) <= new Date()) {
            this.message = 'Pick a time in the future.';
            return;
          }
          const res = await fetch('/alarms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...this.oneOff, repeat_weekly: false }),
          });
          if (res.ok) {
            this.message = 'Alarm added.';
            this.oneOff = { label: 'Alarm', scheduled_at: tomorrowAt7() };
            this.fetchAlarms();
          } else {
            this.message = 'Failed to add alarm.';
          }
        },
        async deleteAlarm(id) {
          await fetch(`/alarms/${id}`, { method: 'DELETE' });
          this.fetchAlarms();
        },
        async stopAlarm() {
          const res = await fetch('/alarm/stop', { method: 'POST' });
          if (!res.ok) {
            this.controlMessage = 'Failed to stop alarm.';
            return;
          }
          const data = await res.json();
          this.controlMessage = data.summary_playing ? 'Alarm stopped. Playing your schedule summary.' : 'Alarm stopped.';
        },
        async playSummary() {
          const res = await fetch('/alarm/summary', { method: 'POST' });
          this.controlMessage = res.ok ? 'Schedule summary is playing.' : 'Failed to play summary.';
        },
        async testSpeakers() {
          const res = await fetch('/alarm/test-speakers', { method: 'POST' });
          this.controlMessage = res.ok ? 'NTS stream is playing.' : 'Failed to test speakers.';
        },
        async stopTest() {
          const res = await fetch('/alarm/test-speakers/stop', { method: 'POST' });
          this.controlMessage = res.ok ? 'Test stream stopped.' : 'Failed to stop test stream.';
        },
        async testVoice() {
          const res = await fetch('/alarm/test-voice', { method: 'POST' });
          this.controlMessage = res.ok ? 'Voice test played.' : 'Failed to play voice test.';
        },
        async fetchLevels() {
          const res = await fetch('/volume');
          if (res.ok) {
            this.levels = await res.json();
          }
        },
        async setLevel(name) {
          const value = this.levels[name];
          const res = await fetch('/volume', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ [name]: value }),
          });
          const label = name[0].toUpperCase() + name.slice(1);
          this.controlMessage = res.ok ? `${label} set to ${value}%.` : `Failed to set ${name}.`;
        },
        async fetchCalendarSummary() {
          const res = await fetch('/calendar/summary');
          if (res.ok) {
            const data = await res.json();
            this.calendarSummary = data.summary;
          } else {
            this.calendarSummary = 'Unable to load calendar summary.';
          }
        },
        init() {
          this.fetchWeek();
          this.fetchAlarms();
          this.fetchLevels();
          this.fetchCalendarSummary();
        },
      }
    }
  </script>
</body>
</html>
